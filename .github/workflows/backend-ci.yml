name: Backend CI

on:
  # Run for all PR changes so required checks are never skipped by path filters.
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.7-bookworm
        env:
          POSTGRES_USER: roam_ci
          POSTGRES_DB: postgres
          # Public, disposable test credential; never use it outside this CI job.
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only
        ports:
          # Random host port, published only on the runner's loopback interface.
          - "127.0.0.1::5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U roam_ci -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 30s
    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          working-directory: backend
          enable-cache: false

      - name: Show runtime versions
        run: |
          python --version
          uv --version

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check types
        run: uv run --no-sync mypy app

      - name: Run database-free tests
        run: uv run --no-sync pytest

      - name: Run PostgreSQL and migration tests
        env:
          TEST_DATABASE_ADMIN_URL: postgresql+psycopg://roam_ci:${{ github.run_id }}-${{ github.run_attempt }}-ci-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: uv run --no-sync pytest --run-db-tests -m database
